name: Update YouTube video

on:
  schedule:
    # Off the top-of-hour and away from 00:00/06:00 UTC — those are the most
    # congested GitHub Actions cron windows, where the shared runner IPs get
    # rate-limited by YouTube. Odd minute + odd hours avoids the pile-up.
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/update-youtube.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add index.html
            git commit -m "Update YouTube section with latest video"
            git push
          fi
