name: Publish scheduled blog posts

on:
  schedule:
    # Every 15 minutes, off the top of the hour (the busiest cron minutes), so timed posts go out promptly.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 scripts/publish_scheduled.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A blog _scheduled index.html
          if git diff --cached --quiet; then
            echo "Nothing to publish"
          else
            git commit -m "Publish scheduled blog post(s)"
            git pull --rebase
            git push
          fi
