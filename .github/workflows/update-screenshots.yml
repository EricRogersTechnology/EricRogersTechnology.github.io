name: Update App Store screenshots

on:
  schedule:
    # Every 6 hours, off the top of the hour (the busiest cron minutes).
    - cron: '41 2,8,14,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 scripts/update_screenshots.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products/screenshots.json
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "Update App Store screenshots"
            git pull --rebase
            git push
          fi
